name: Build MRJ V2 Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        display:
          - MRJ_OLED_096_SSD1306_128x64
          - MRJ_OLED_13_SSD1306_128x64
          - MRJ_OLED_15_SH1106_128x64
          - MRJ_OLED_20_SSD1306_128x64
          - MRJ_OLED_242_SH1106_128x64
          - MRJ_TFT_13_ST7789_240x240
          - MRJ_TFT_154_ST7789_240x240
          - MRJ_TFT_18_ST7735_128x160
          - MRJ_TFT_20_ST7789_240x320
          - MRJ_TFT_24_ILI9341_240x320
          - MRJ_TFT_24_ST7789_240x320
          - MRJ_TFT_28_ILI9341_240x320
          - MRJ_TFT_35_ILI9488_320x480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PlatformIO
        uses: platformio/action@v2

      - name: Build firmware
        working-directory: displays/${{ matrix.display }}
        run: pio run

      - name: Collect BIN
        run: |
          mkdir -p firmware
          cp "displays/${{ matrix.display }}/.pio/build/esp32dev/firmware.bin"              "firmware/${{ matrix.display }}.bin"

      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.display }}
          path: firmware/${{ matrix.display }}.bin
