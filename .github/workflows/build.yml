name: Build MRJ V2 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MRJ_OLED_096_SSD1306_128x64
            path: displays/MRJ_OLED_096_SSD1306_128x64
          - name: MRJ_OLED_13_SSD1306_128x64
            path: displays/MRJ_OLED_13_SSD1306_128x64
          - name: MRJ_OLED_15_SH1106_128x64
            path: displays/MRJ_OLED_15_SH1106_128x64
          - name: MRJ_OLED_20_SSD1306_128x64
            path: displays/MRJ_OLED_20_SSD1306_128x64
          - name: MRJ_OLED_242_SH1106_128x64
            path: displays/MRJ_OLED_242_SH1106_128x64
          - name: MRJ_TFT_13_ST7789_240x240
            path: displays/MRJ_TFT_13_ST7789_240x240
          - name: MRJ_TFT_154_ST7789_240x240
            path: displays/MRJ_TFT_154_ST7789_240x240
          - name: MRJ_TFT_18_ST7735_128x160
            path: displays/MRJ_TFT_18_ST7735_128x160
          - name: MRJ_TFT_20_ST7789_240x320
            path: displays/MRJ_TFT_20_ST7789_240x320
          - name: MRJ_TFT_24_ILI9341_240x320
            path: displays/MRJ_TFT_24_ILI9341_240x320
          - name: MRJ_TFT_24_ST7789_240x320
            path: displays/MRJ_TFT_24_ST7789_240x320
          - name: MRJ_TFT_28_ILI9341_240x320
            path: displays/MRJ_TFT_28_ILI9341_240x320
          - name: MRJ_TFT_35_ILI9488_320x480
            path: displays/MRJ_TFT_35_ILI9488_320x480
          - name: MRJ_FW_V2_FIXED
            path: displays/MRJ_FW_V2_FIXED

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('displays/**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: pio run -e esp32dev

      - name: Collect binaries
        run: |
          mkdir -p "bins/${{ matrix.name }}"
          BUILD="${{ matrix.path }}/.pio/build/esp32dev"
          cp -v "$BUILD"/firmware.bin "bins/${{ matrix.name }}/"
          cp -v "$BUILD"/bootloader.bin "bins/${{ matrix.name }}/" 2>/dev/null || true
          cp -v "$BUILD"/partitions.bin "bins/${{ matrix.name }}/" 2>/dev/null || true
          ls -la "bins/${{ matrix.name }}/"

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: bins/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package All BINs
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all_bins
          pattern: bin-*
          merge-multiple: false

      - name: Create ZIP
        run: |
          find all_bins -name "*.bin" | sort
          cd all_bins && zip -r ../MRJ_FW_V2_ALL_BINS.zip . && cd ..
          ls -lh MRJ_FW_V2_ALL_BINS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MRJ_FW_V2_ALL_BINS
          path: MRJ_FW_V2_ALL_BINS.zip
          retention-days: 90
