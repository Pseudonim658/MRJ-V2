<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRJ V2 Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { color: #00d4ff; margin-bottom: 20px; text-align: center; }
        .card { background: #16213e; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .card h2 { color: #e94560; margin-bottom: 10px; font-size: 16px; }
        .btn { background: #0f3460; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #e94560; }
        .status { color: #00ff88; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        pre { background: #0a0a1a; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>MRJ V2 Dashboard</h1>
    <div class="grid">
        <div class="card">
            <h2>Status</h2>
            <p>Version: <span class="status">2.1.0</span></p>
            <p>AP: <span class="status" id="ap-status">MRJ_AP</span></p>
            <button class="btn" onclick="fetchStatus()">Refresh</button>
        </div>
        <div class="card">
            <h2>WiFi Tools</h2>
            <button class="btn">Scan Networks</button>
            <button class="btn">Start Deauth</button>
            <button class="btn">Nethercap Portal</button>
        </div>
        <div class="card">
            <h2>BLE Tools</h2>
            <button class="btn">BLE Scan</button>
            <button class="btn">BLE Spam</button>
        </div>
        <div class="card">
            <h2>Sub-GHz</h2>
            <button class="btn">Freq Scan</button>
            <button class="btn">RX Mode</button>
        </div>
        <div class="card">
            <h2>RFID / NFC</h2>
            <button class="btn">Read NFC</button>
            <button class="btn">Read RFID</button>
        </div>
        <div class="card">
            <h2>GPIO Control</h2>
            <button class="btn">Toggle Pin</button>
            <button class="btn">Read Pin</button>
        </div>
    </div>
    <div class="card" style="margin-top: 15px;">
        <h2>Logs</h2>
        <pre id="logs">Waiting for data...</pre>
    </div>
    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                document.getElementById('logs').textContent = JSON.stringify(data, null, 2);
            } catch(e) {
                document.getElementById('logs').textContent = 'Error: ' + e.message;
            }
        }
        fetchStatus();
    </script>
</body>
</html>
